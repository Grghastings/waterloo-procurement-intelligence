<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Waterloo Tactical Procurement Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <small>WATERLOO</small>
      <h1>Tactical Procurement Intelligence</h1>
      <p>U.S. police, SWAT &amp; law-enforcement training opportunities</p>
    </div>
    <div id="date"></div>
  </header>
  <main>
    <section class="metrics">
      <div><b id="n">0</b> opportunities</div>
      <div><b id="p">0</b> pursue</div>
      <div><b id="i">0</b> investigate</div>
      <div><b id="u">0</b> urgent</div>
    </section>
    <section class="filters">
      <input id="q" placeholder="Search agency, SWAT, training, state, NAICS..." autocomplete="off">
      <select id="r">
        <option value="">All recommendations</option>
        <option>PURSUE</option>
        <option>INVESTIGATE</option>
        <option>WATCH</option>
        <option>PASS</option>
      </select>
    </section>
    <div id="cards"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
