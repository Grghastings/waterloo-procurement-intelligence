name: Daily Procurement Update

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect World Bank notices
        run: python scripts/update_world_bank.py

      - name: Score opportunities
        run: python scripts/score_opportunities.py

      - name: Commit updated data
        run: |
          git config user.name "FPI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || git commit -m "Daily procurement update"
          git push
